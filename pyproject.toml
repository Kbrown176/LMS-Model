[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lms-model"
version = "0.1.0"
description = "Premier League Last Man Standing pick optimiser: Dixon-Coles match model, market-odds blending and survival-maximising pick paths."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Killian Brown" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lms = "lms.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
