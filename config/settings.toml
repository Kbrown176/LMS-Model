# LMS model settings. Team-specific data never goes here, only rules and tuning knobs.

[season]
current = "2627"          # football-data.co.uk season code (2026/27)
history_seasons = 5       # past seasons used for model training
divisions = ["E0", "E1"]  # Premier League + Championship (rates promoted clubs)

[rules]
lives = 2                 # default lives; override with --lives
# Draw = out, no team reuse. These are fixed by the competition format.

[strategy]
horizon = 10              # gameweeks to plan ahead
min_win_prob = 0.0        # optional floor for any pick in the path
# Derbies (config/derbies.csv) are always flagged. 5 seasons of PL data show no reliable
# derby upset effect beyond what the odds already price, so neither option is on by default.
avoid_derbies = false     # never pick a team in a derby at least this intense:
derby_min_intensity = 0.8
derby_penalty = 0.0       # soft option: win prob x (1 - penalty x intensity)

[model]
time_decay_half_life_days = 270   # older matches count for less (tuned: `lms calibrate --tune`)
ridge = 1.0                       # pulls teams with little data towards average

[blend]
market_weight = 0.5   # weight on bookmaker odds where they exist. Tuning is flat from 0 to 0.5
                      # once ratings are market-adjusted; 0.5 keeps this week's odds in directly.
adjust_ridge = 0.03   # how freely odds may nudge team ratings for later weeks (tuned)
