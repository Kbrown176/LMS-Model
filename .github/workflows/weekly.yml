name: Weekly picks

# Tuesday morning (after the weekend, before any midweek deadline) and Friday morning
# (before the usual Friday-evening / Saturday deadline). 2 Odds API requests a week.
on:
  schedule:
    - cron: "0 6 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # Past seasons' results never change; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: results-${{ github.run_id }}
          restore-keys: results-

      - name: Refresh data
        run: lms refresh --max-age-hours 0
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Write PICKS.md
        run: lms report

      - name: Commit PICKS.md
        run: |
          git config user.name "Killian Brown"
          git config user.email "245885191+Kbrown176@users.noreply.github.com"
          git add PICKS.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "$(head -1 PICKS.md | sed 's/^# //')"
            git push
          fi

      - name: Job summary
        run: cat PICKS.md >> "$GITHUB_STEP_SUMMARY"
